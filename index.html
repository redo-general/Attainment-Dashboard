  return{bg:T.green,fg:T.page};
};
const prettify = s => s.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const nowMonthKey = () => new Intl.DateTimeFormat("en-CA",{timeZone:"America/Denver",year:"numeric",month:"2-digit"}).format(new Date()).slice(0,7);

/* ---------------- SQL generators ---------------- */
const DEALS="STAGING.HUBSPOT.STG_DEALS", REPORT="KITCHEN.PANTRY.INGR_MONTHLY_REPORT_V2", START="2023-01-01";
const sq = s => `'${String(s).replace(/'/g,"''")}'`;
const qid = s => `"${String(s).replace(/"/g,'""')}"`;
const talias = slug => "t_"+slug.replace(/[^a-z0-9_]/gi,"_").toLowerCase();
const revExpr = cols => cols.length ? cols.map(c=>`ZEROIFNULL(${qid(c)})`).join(" + ") : "0";
const monthSpan = nowKey => { const [y,m]=nowKey.split("-").map(Number); return (y-2023)*12+(m-1)+1; };
function baseCTEs(types, span){
  const slugs = types.map(t=>sq(t.slug)).join(",");
  return `
months AS (SELECT DATEADD(month, ROW_NUMBER() OVER (ORDER BY seq4())-1, DATE '${START}') AS m FROM TABLE(GENERATOR(ROWCOUNT => ${span}))),
report_mids AS (SELECT DISTINCT ${qid("Merchant ID")} AS mid FROM ${REPORT}),
deals AS (
  SELECT TEAM_ID AS mid, PRODUCT AS type, DEAL_AMOUNT AS arr,
         DATE_TRUNC('month', CONVERT_TIMEZONE('America/Denver', CLOSED_WON))::date AS close_m, DEAL_ID
  FROM ${DEALS}
  WHERE HS_IS_CLOSED_WON = TRUE AND CLOSED_WON IS NOT NULL AND TEAM_ID IS NOT NULL
    AND PRODUCT IN (${slugs}) AND CONVERT_TIMEZONE('America/Denver', CLOSED_WON) >= DATE '${START}'
    AND TEAM_ID IN (SELECT mid FROM report_mids))`;
}
function revLongCTE(types, extraWhere=""){
  const inner = types.map(t=>`${revExpr(t.cols)} AS ${talias(t.slug)}`).join(",\n      ");
  const al = types.map(t=>talias(t.slug));
  const cases = types.map(t=>`WHEN ${sq(talias(t.slug))} THEN ${sq(t.slug)}`).join(" ");
  return `
rev_long AS (
  SELECT mid, m, CASE LOWER(typecol) ${cases} END AS type, rev
  FROM (SELECT ${qid("Merchant ID")} AS mid, ${qid("Date")} AS m, ${inner}
        FROM ${REPORT} WHERE ${qid("Date")} >= DATE '${START}' ${extraWhere})
  UNPIVOT (rev FOR typecol IN (${al.join(",")}))),
rev AS (SELECT mid, m, type, SUM(rev) AS rev FROM rev_long GROUP BY 1,2,3)`;
}
const qDealTypes = () => `SELECT PRODUCT AS slug, COUNT(*) AS n, ROUND(SUM(DEAL_AMOUNT)) AS arr, MAX(PRODUCT_CLOUD) AS product_cloud
  FROM ${DEALS} WHERE HS_IS_CLOSED_WON = TRUE AND CLOSED_WON IS NOT NULL
    AND CONVERT_TIMEZONE('America/Denver', CLOSED_WON) >= DATE '${START}' AND PRODUCT IS NOT NULL AND PRODUCT <> ''
  GROUP BY 1 ORDER BY n DESC`;
const qRevenueColumns = () => `SELECT column_name AS col FROM KITCHEN.INFORMATION_SCHEMA.COLUMNS
  WHERE table_schema='PANTRY' AND table_name='INGR_MONTHLY_REPORT_V2' AND column_name ILIKE '%Revenue%' ORDER BY ordinal_position`;
const qGrid = (types, span) => `WITH ${baseCTEs(types,span)},
deal_months AS (SELECT d.mid, d.type, d.arr, d.close_m, d.DEAL_ID, mo.m,
    ROW_NUMBER() OVER (PARTITION BY d.mid, d.type, mo.m ORDER BY d.close_m DESC, d.DEAL_ID DESC) AS rn
  FROM deals d JOIN months mo ON mo.m >= d.close_m),
attributed AS (SELECT mid, type, m, arr, close_m FROM deal_months WHERE rn = 1),
${revLongCTE(types)},
joined AS (SELECT a.close_m AS cohort, a.type, a.m, a.arr/12 AS expected, COALESCE(r.rev,0) AS actual, a.mid
  FROM attributed a LEFT JOIN rev r ON r.mid=a.mid AND r.type=a.type AND r.m=a.m),
per_month AS (SELECT cohort, type, m, SUM(expected) AS expected, SUM(actual) AS actual, COUNT(DISTINCT mid) AS merchants
  FROM joined GROUP BY 1,2,3)
SELECT TO_CHAR(cohort,'YYYY-MM') AS cohort, type,
  ARRAY_AGG(ROUND(expected)::int) WITHIN GROUP (ORDER BY m) AS exp_arr,
  ARRAY_AGG(ROUND(actual)::int)   WITHIN GROUP (ORDER BY m) AS act_arr,
  ARRAY_AGG(merchants)            WITHIN GROUP (ORDER BY m) AS cnt_arr
FROM per_month GROUP BY cohort, type ORDER BY cohort, type`;
const qTotalMapped = (types, span) => `WITH ${baseCTEs(types,span)},
${revLongCTE(types)},
tm AS (SELECT type, m, SUM(rev) AS rev FROM rev GROUP BY 1,2)
SELECT tm.type, ARRAY_AGG(ROUND(ZEROIFNULL(tm.rev))::int) WITHIN GROUP (ORDER BY tm.m) AS rev_arr,
  ARRAY_AGG(TO_CHAR(tm.m,'YYYY-MM')) WITHIN GROUP (ORDER BY tm.m) AS mon_arr
FROM tm GROUP BY tm.type ORDER BY tm.type`;
const qNoMatchAgg = types => { const slugs=types.map(t=>sq(t.slug)).join(",");
  return `WITH report_mids AS (SELECT DISTINCT ${qid("Merchant ID")} AS mid FROM ${REPORT})
SELECT TO_CHAR(DATE_TRUNC('month', CONVERT_TIMEZONE('America/Denver', CLOSED_WON))::date,'YYYY-MM') AS cohort,
  PRODUCT AS type, COUNT(*) AS n, ROUND(SUM(DEAL_AMOUNT)) AS arr
FROM ${DEALS} WHERE HS_IS_CLOSED_WON = TRUE AND CLOSED_WON IS NOT NULL
  AND CONVERT_TIMEZONE('America/Denver', CLOSED_WON) >= DATE '${START}' AND PRODUCT IN (${slugs})
  AND (TEAM_ID IS NULL OR TEAM_ID NOT IN (SELECT mid FROM report_mids)) GROUP BY 1,2 ORDER BY 1,2`; };
const qNoMatchDeals = (types, limit=100) => { const slugs=types.map(t=>sq(t.slug)).join(",");
  return `WITH report_mids AS (SELECT DISTINCT ${qid("Merchant ID")} AS mid FROM ${REPORT})
SELECT DEAL_NAME AS name, COALESCE(AE_NAME,'—') AS rep, COALESCE(TEAM_ID,'—') AS redo_id,
  PRODUCT AS type, ROUND(DEAL_AMOUNT) AS arr,
  TO_CHAR(DATE_TRUNC('month', CONVERT_TIMEZONE('America/Denver', CLOSED_WON))::date,'YYYY-MM') AS cohort
FROM ${DEALS} WHERE HS_IS_CLOSED_WON = TRUE AND CLOSED_WON IS NOT NULL
  AND CONVERT_TIMEZONE('America/Denver', CLOSED_WON) >= DATE '${START}' AND PRODUCT IN (${slugs})
  AND (TEAM_ID IS NULL OR TEAM_ID NOT IN (SELECT mid FROM report_mids))
ORDER BY DEAL_AMOUNT DESC NULLS LAST LIMIT ${limit}`; };
const qCellDeals = (types, cohort, month) => { const slugs=types.map(t=>sq(t.slug)).join(",");
  const cd=`${cohort}-01`, md=`${month}-01`;
  return `WITH report_mids AS (SELECT DISTINCT ${qid("Merchant ID")} AS mid FROM ${REPORT}),
mnames AS (SELECT ${qid("Merchant ID")} AS mid, MAX_BY(${qid("Merchant Name")}, ${qid("Date")}) AS name FROM ${REPORT} GROUP BY 1),
cohort_deals AS (SELECT DEAL_ID, DEAL_NAME AS name, COALESCE(AE_NAME,'—') AS rep, TEAM_ID AS mid, PRODUCT AS type, DEAL_AMOUNT AS arr
  FROM ${DEALS} WHERE HS_IS_CLOSED_WON = TRUE AND CLOSED_WON IS NOT NULL AND TEAM_ID IS NOT NULL
    AND PRODUCT IN (${slugs}) AND TEAM_ID IN (SELECT mid FROM report_mids)
    AND DATE_TRUNC('month', CONVERT_TIMEZONE('America/Denver', CLOSED_WON))::date = DATE '${cd}'),
latest AS (SELECT TEAM_ID AS mid, PRODUCT AS type, MAX(DATE_TRUNC('month', CONVERT_TIMEZONE('America/Denver', CLOSED_WON))::date) AS max_close
  FROM ${DEALS} WHERE HS_IS_CLOSED_WON = TRUE AND CLOSED_WON IS NOT NULL AND TEAM_ID IS NOT NULL AND PRODUCT IN (${slugs})
    AND DATE_TRUNC('month', CONVERT_TIMEZONE('America/Denver', CLOSED_WON))::date <= DATE '${md}' GROUP BY 1,2),
${revLongCTE(types, `AND ${qid("Date")} = DATE '${md}'`)},
alloc AS (SELECT cd.*, l.max_close, SUM(cd.arr) OVER (PARTITION BY cd.mid, cd.type) AS grp_arr
  FROM cohort_deals cd JOIN latest l ON l.mid=cd.mid AND l.type=cd.type)
SELECT a.name, a.rep, COALESCE(mn.name, a.mid) AS merchant, a.type, ROUND(a.arr) AS arr,
  CASE WHEN a.max_close = DATE '${cd}' THEN ROUND(COALESCE(r.rev,0) * a.arr / NULLIF(a.grp_arr,0)) END AS actual,
  CASE WHEN a.max_close = DATE '${cd}' THEN 1 ELSE 0 END AS active
FROM alloc a LEFT JOIN rev r ON r.mid=a.mid AND r.type=a.type LEFT JOIN mnames mn ON mn.mid=a.mid
ORDER BY a.arr DESC NULLS LAST LIMIT 500`; };

/* ---------------- data helpers ---------------- */
function toObj(row, cols){
  if(Array.isArray(row)){ const o={}; cols.forEach((c,i)=>o[c]=row[i]); return o; }
  const o={}; for(const k in row) o[k.toLowerCase()]=row[k]; return o;
}
const num = v => { if(v==null)return 0; if(typeof v==="number")return v; const n=Number(v); return isNaN(n)?0:n; };
function parseArr(v){ if(v==null)return[]; if(Array.isArray(v))return v.map(num);
  if(typeof v==="string"){ try{return JSON.parse(v).map(num);}catch{return[];} } return[]; }
function parseStrArr(v){ if(Array.isArray(v))return v.map(String);
  if(typeof v==="string"){ try{return JSON.parse(v).map(String);}catch{return[];} } return[]; }
async function runSql(sql, cols){
  const res = await fridge.snowflake.query(sql, { limit: 500 });
  const rows = (res && res.rows) || [];
  return rows.map(r=>toObj(r,cols));
}
function seedConfig(){ const types={},order=[];
  for(const [slug,v] of Object.entries(DEFAULT_TYPES)){ types[slug]={name:v.name,cloud:v.cloud,cols:[...v.cols],on:true}; order.push(slug); }
  return {types,order}; }
function mergeDiscovery(config, disc){
  const cfg={ types:{...config.types}, order:[...config.order] };
  for(const dt of disc.dealTypes){
    if(!cfg.types[dt.slug]){ const def=DEFAULT_TYPES[dt.slug];
      cfg.types[dt.slug]= def?{name:def.name,cloud:def.cloud,cols:[...def.cols],on:true}:{name:prettify(dt.slug),cloud:"other",cols:[],on:false};
      cfg.order.push(dt.slug); }
    cfg.types[dt.slug].count=dt.n; cfg.types[dt.slug].arr=dt.arr;
  }
  return cfg;
}
const activeTypes = config => config.order.filter(s=>config.types[s].on && config.types[s].cols.length).map(s=>({slug:s,cols:config.types[s].cols}));

  for(const s of config.order){ const t=config.types[s]; if(t.on&&t.cols.length) ids.add(t.cloud||"other"); }
  return CLOUDS.filter(c=>ids.has(c.id)); };

async function discover(){
  const [dealTypes, revCols] = await Promise.all([
    runSql(qDealTypes(), ["slug","n","arr","product_cloud"]),
    runSql(qRevenueColumns(), ["col"]),
  ]);
  return { dealTypes: dealTypes.map(r=>({slug:r.slug,n:num(r.n),arr:num(r.arr)})), revCols: revCols.map(r=>r.col) };
}
async function refreshAll(config, nowKey){
  const types = activeTypes(config);
  if(!types.length) throw new Error("No deal types are mapped to a revenue column. Open Configure to map at least one.");
  const span = monthSpan(nowKey);
  const [grid, totalMapped, noMatchAgg, noMatchDeals] = await Promise.all([
    runSql(qGrid(types,span), ["cohort","type","exp_arr","act_arr","cnt_arr"]),
    runSql(qTotalMapped(types,span), ["type","rev_arr","mon_arr"]),
    runSql(qNoMatchAgg(types), ["cohort","type","n","arr"]),
    runSql(qNoMatchDeals(types), ["name","rep","redo_id","type","arr","cohort"]),
  ]);
  return {
    grid: grid.map(r=>({cohort:r.cohort, type:r.type, exp:parseArr(r.exp_arr), act:parseArr(r.act_arr), cnt:parseArr(r.cnt_arr)})),
    totalMapped: totalMapped.map(r=>({type:r.type, rev:parseArr(r.rev_arr), months:parseStrArr(r.mon_arr)})),
    noMatchAgg: noMatchAgg.map(r=>({cohort:r.cohort, type:r.type, n:num(r.n), arr:num(r.arr)})),
    noMatchDeals: noMatchDeals.map(r=>({name:r.name, rep:r.rep, redoId:r.redo_id, type:r.type, arr:num(r.arr), cohort:r.cohort})),
    nowKey, refreshedAt: new Date().toISOString(),
  };
}
const STORE = { config:"attainment_config", data:"attainment_data" };
async function saveConfig(c){ await fridge.db.collection(STORE.config).create({value:c},"v1"); }
async function loadConfig(){ try{ const d=await fridge.db.collection(STORE.config).list(); const doc=d.find(x=>x.key==="v1")||d[0]; return doc?(doc.value?.value||doc.value):null; }catch{return null;} }
/* The cohort grid is far larger than fridge.db's 64 KB/doc limit, so the cache
   is chunked: a "latest" manifest doc plus grid_N docs of ~30 rows each. */
async function saveData(x){
  const col = fridge.db.collection(STORE.data);
  const CHUNK = 25;
  const chunks = [];
  for(let i=0;i<x.grid.length;i+=CHUNK) chunks.push(x.grid.slice(i,i+CHUNK));
  for(let i=0;i<chunks.length;i++) await col.create({value:chunks[i]}, "grid_"+i);
  await col.create({value:{ v:2, chunks:chunks.length, totalMapped:x.totalMapped,
    noMatchAgg:x.noMatchAgg, noMatchDeals:x.noMatchDeals, nowKey:x.nowKey, refreshedAt:x.refreshedAt }}, "latest");
}
async function loadData(){
  try{
    const docs = await fridge.db.collection(STORE.data).list();
    const map = {}; for(const d of docs) map[d.key] = (d.value && d.value.value!==undefined) ? d.value.value : d.value;
    const man = map["latest"]; if(!man) return null;
    if(man.v===2){
      const grid=[]; for(let i=0;i<man.chunks;i++){ const c=map["grid_"+i]; if(Array.isArray(c)) grid.push(...c); }
      if(grid.length!==0 || man.chunks===0)
        return { grid, totalMapped:man.totalMapped, noMatchAgg:man.noMatchAgg, noMatchDeals:man.noMatchDeals, nowKey:man.nowKey, refreshedAt:man.refreshedAt };
      return null;
    }
    return man.grid ? man : null;
  }catch{ return null; }
}

/* ---------------- model ---------------- */
function computeModel(data, selected){
  const series = data.grid.filter(s=>selected.has(s.type));
  let last = START_MONTH;
  for(const s of data.grid){ const end=addMonths(s.cohort, s.exp.length-1); if(end>last) last=end; }
  if(data.nowKey && data.nowKey>last) last=data.nowKey;
  const MONTHS=[]; for(let k=START_MONTH;k<=last;k=addMonths(k,1)) MONTHS.push(k);
  const MIDX=Object.fromEntries(MONTHS.map((m,i)=>[m,i]));
  const detailMonth=addMonths(last,-1);
  const cohorts=[...new Set(series.map(s=>s.cohort))].sort();
  const rows=[]; let maxSpan=0;
  for(const c of cohorts){
    const cs=series.filter(s=>s.cohort===c); if(!cs.length)continue;
    const span=monthDiff(c,last)+1;
    const exp=Array(span).fill(0),act=Array(span).fill(0),dls=Array(span).fill(0);
    let arr=0,deals0=0;
    for(const s of cs){ arr+=(s.exp[0]||0)*12; deals0+=(s.cnt[0]||0);
      s.exp.forEach((v,i)=>{if(i<span)exp[i]+=v;}); s.act.forEach((v,i)=>{if(i<span)act[i]+=v;}); s.cnt.forEach((v,i)=>{if(i<span)dls[i]+=v;}); }
    if(deals0===0 && arr===0 && act.every(v=>v===0)) continue;
    maxSpan=Math.max(maxSpan,span); rows.push({c,span,exp,act,dls,arr,deals0});
  }
  const ATTR={};
  for(const s of data.grid){ if(!ATTR[s.type])ATTR[s.type]=Array(MONTHS.length).fill(0);
    const base=MIDX[s.cohort]; if(base==null)continue;
    s.act.forEach((v,i)=>{const mi=base+i; if(mi<MONTHS.length)ATTR[s.type][mi]+=v;}); }
  const REVT={};
  for(const t of data.totalMapped){ const arr=Array(MONTHS.length).fill(0);
    t.months.forEach((mk,i)=>{const mi=MIDX[mk]; if(mi!=null)arr[mi]=t.rev[i]||0;}); REVT[t.type]=arr; }
  const unatt=MONTHS.map((_,mi)=>{ let u=0; selected.forEach(t=>{u+=Math.max(0,(REVT[t]?.[mi]||0)-(ATTR[t]?.[mi]||0));}); return u; });
  const nm=data.noMatchAgg.filter(r=>selected.has(r.type));
  const nmTotals=nm.reduce((a,r)=>({n:a.n+r.n,amt:a.amt+r.arr}),{n:0,amt:0});
  const nmByCohort={}; nm.forEach(r=>{nmByCohort[r.cohort]=(nmByCohort[r.cohort]||0)+r.arr;});
  let se=0,sa=0,jE=0,jA=0,totArr=0,totDeals=0; const jIdx=MIDX[detailMonth];
  for(const r of rows){ totArr+=r.arr; totDeals+=r.deals0;
    r.exp.forEach((e,i)=>{ const mi=MIDX[r.c]+i;
      if(mi<MONTHS.length-1){se+=e;sa+=r.act[i];} if(mi===jIdx){jE+=e;jA+=r.act[i];} }); }
  return { rows, maxSpan, unatt, nmTotals, nmByCohort, MONTHS, MIDX, last, detailMonth, cohorts,
    overall: se>0?sa/se:null, junPct: jE>0?jA/jE:null, totArr, totDeals };
}

/* ---------------- tiny DOM helper ---------------- */
function h(tag, props, ...kids){
  const el=document.createElement(tag);
  if(props){ for(const k in props){ const v=props[k];
    if(k==="style" && v && typeof v==="object") Object.assign(el.style,v);
    else if(k==="class") el.className=v;
    else if(k==="html") el.innerHTML=v;
    else if(k.startsWith("on") && typeof v==="function") el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="title") el.title=v;
    else if(v!=null && v!==false) el.setAttribute(k,v);
  }}
  for(const kid of kids.flat()){ if(kid==null||kid===false)continue;
    el.appendChild(typeof kid==="object"?kid:document.createTextNode(String(kid))); }
  return el;
}

/* ---------------- actions ---------------- */
async function doRefresh(cfgOverride){
  if(!fridge) return;
  const cfg = cfgOverride || state.config;
  setState({ phase:"busy", error:null, busyMsg:"Discovering deal types & revenue columns…" });
  try{
    const disc = await discover();
    const merged = mergeDiscovery(cfg, disc);
    try{ await saveConfig(merged); }catch(e){ console.warn("config cache failed", e); }
    setState({ discovered:disc, config:merged, busyMsg:"Querying Snowflake — cohort grid, revenue totals, no-match…" });
    const fresh = await refreshAll(merged, nowMonthKey());
    const selected = state.selected.size ? state.selected : defaultSelection(merged);
    setState({ data:fresh, selected, phase:"ready", busyMsg:"" });
    // cache is best-effort: a failed write must never break a completed refresh
    try{ await saveData(fresh); }catch(e){ console.warn("data cache failed", e); }
  }catch(e){
    setState({ error:String(e?.message||e), phase: state.data?"ready":"error", busyMsg:"" });
  }
}
async function saveConfigAndRefresh(newCfg){
  try{ await saveConfig(newCfg); }catch(e){ console.warn("config cache failed", e); }
  setState({ config:newCfg, selected:defaultSelection(newCfg), drawer:false });
  await doRefresh(newCfg);
}

/* ---------------- boot ---------------- */
(async function boot(){
  try{
    const mod = await import("/api/sdk");
    fridge = mod.createFridge();
    try{ user = await fridge.identity.me(); }catch{}
    const savedCfg = await loadConfig();
    const cfg = (savedCfg && savedCfg.order) ? savedCfg : seedConfig();
    const cached = await loadData();
    if(cached && cached.grid){ setState({ config:cfg, data:cached, selected:defaultSelection(cfg), phase:"ready" }); }
    else { setState({ config:cfg, phase:"needsConnect" }); }
  }catch(e){ setState({ error:String(e?.message||e), phase:"error" }); }
})();

function render(){

  app.innerHTML="";

  const main = h("main",{style:{maxWidth:"1440px",margin:"0 auto",padding:"24px 48px 64px"}});
  if(state.error) main.appendChild(ErrorBanner(state.error));

  if(state.phase==="init") main.appendChild(Splash("Connecting to Fridge runtime…"));
  else if(state.phase==="error" && !state.data) main.appendChild(Splash("Could not load. Check Snowflake access, then Refresh.", "error"));
  else if(state.phase==="needsConnect") main.appendChild(ConnectCard());
  else if(state.phase==="busy" && !state.data) main.appendChild(Splash(state.busyMsg||"Working…", "spin"));

  if(state.data && state.config){
    const model = computeModel(state.data, state.selected);
    state._model = model;
    if(state.phase==="busy") main.appendChild(h("div",{style:{fontSize:"12px",color:T.orange,marginBottom:"16px",display:"flex",gap:"8px",alignItems:"center"}}, spinIcon(), state.busyMsg));

  }
  app.appendChild(main);
  renderOverlay();
}

  const allSel=cfg.order.filter(s=>cfg.types[s].on && cfg.types[s].cols.length);
  let activeCloud="custom", clouds=mappedCloudIds(cfg);
  if(state.selected.size===allSel.length && allSel.length) activeCloud="all";
  else for(const cl of clouds){ const codes=cloudSlugs(cfg,cl.id); if(codes.length===state.selected.size && codes.every(c=>state.selected.has(c))){activeCloud=cl.id;break;} }
  const scopeLabel = activeCloud==="all"?"All products":activeCloud==="custom"?`${state.selected.size} of ${allSel.length} products`:(CLOUDS.find(c=>c.id===activeCloud)?.label||"");
  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(180px, 1fr))",border:`1px solid ${T.divider}`,background:T.surface,marginTop:"24px"}});
  grid.appendChild(Stat(`Overall attainment · ${scopeLabel}`, fmtPct(model.overall), `through ${keyToLabel(model.detailMonth)}`, true));
  grid.appendChild(Stat("Closed ARR in view", fmtMoney(model.totArr), `${model.cohorts.length?keyToLabel(model.cohorts[0]):""} – ${keyToLabel(model.last)}`));
  grid.appendChild(Stat("Merchant-deals in view", model.totDeals.toLocaleString(), "matched to Monthly Report"));

function cloneCfg(config){ const types={}; for(const k in config.types) types[k]={...config.types[k],cols:[...config.types[k].cols]}; return {types,order:[...config.order]}; }
function ConfigDrawer(){
  let draft=cloneCfg(state.config);
  let expanded=null;
  const close=()=>setState({drawer:false});
  const rerender=()=>{ const fresh=build(); panel.replaceWith(fresh); panel=fresh; };
  function availableCols(){ const s=new Set(state.discovered?.revCols||[]); for(const slug of draft.order) draft.types[slug].cols.forEach(c=>s.add(c)); return [...s].sort(); }
  function dupes(){ const seen={}; for(const slug of draft.order){ const t=draft.types[slug]; if(!t.on)continue; for(const c of t.cols)(seen[c]=seen[c]||[]).push(t.name); } return Object.entries(seen).filter(([,ts])=>ts.length>1); }
  function autoMap(){ for(const slug of draft.order){ const t=draft.types[slug]; if(t.cols.length)continue;
    const g=(state.discovered?.revCols||[]).find(c=>c.toLowerCase()===`${t.name} revenue`.toLowerCase()) || (state.discovered?.revCols||[]).find(c=>c.toLowerCase().startsWith(t.name.toLowerCase())&&c.toLowerCase().endsWith("revenue")); if(g)t.cols=[g]; } rerender(); }
  function build(){
    const cols=availableCols(); const dd=dupes();
    const body=h("div",{style:{padding:"24px",fontSize:"13px",lineHeight:"20px"}});
    body.appendChild(Section("How it works", h("div",null,
      Mono("STAGING.HUBSPOT.STG_DEALS")," (closed-won) joins ",Mono("KITCHEN.PANTRY.INGR_MONTHLY_REPORT_V2")," on Redo ID (",Mono("TEAM_ID")," = ",Mono("Merchant ID"),"). Expected monthly = deal ARR ÷ 12. Each deal type sums one or more revenue columns below; edit the mapping whenever the report’s columns change, then ",h("strong",{style:{color:T.text}},"Save & refresh"),".")));
    if(dd.length){
      const warn=h("div",{style:{border:`1px solid ${T.orange}`,background:"rgba(255,68,5,0.08)",padding:"10px 14px",marginBottom:"16px",fontSize:"12px",color:"#FFB59B",display:"flex",gap:"8px"}},
        icon(IC.alert,15), h("div",null, "Same revenue column mapped to multiple included types — this double-counts revenue:", dd.map(([c,ts])=>h("div",{style:{marginTop:"4px"}}, Mono(c)," → ",ts.join(", ")))));
      body.appendChild(warn);
    }
    body.appendChild(h("div",{style:{display:"flex",gap:"8px",marginBottom:"16px"}},
      h("button",{style:{display:"inline-flex",alignItems:"center",gap:"6px",padding:"6px 12px",fontSize:"12px",fontWeight:600,cursor:"pointer",border:`1px solid ${T.divider2}`,background:"transparent",color:T.body}, onClick:autoMap}, icon(IC.wand,13),"Auto-map unmapped by name")));
    CLOUDS.forEach(cl=>{
      const slugs=draft.order.filter(s=>(draft.types[s].cloud||"other")===cl.id); if(!slugs.length)return;
      const group=h("div",{style:{marginBottom:"20px"}}, h("div",{style:{fontSize:"10px",fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:T.muted,marginBottom:"8px"}}, cl.label));
      slugs.forEach(slug=>{
        const t=draft.types[slug]; const open=expanded===slug;
        const rowTop=h("div",{style:{display:"flex",alignItems:"center",gap:"10px"}},
          h("label",{style:{cursor:"pointer",display:"inline-flex"}, onClick:()=>{t.on=!t.on;rerender();}}, checkBox(t.on,15)),
          h("div",{style:{minWidth:"150px"}},
            h("div",{style:{fontSize:"13px",color:T.text,fontWeight:600}}, t.name),
            h("div",{style:{fontSize:"10px",color:T.muted}}, `${slug}${t.count!=null?` · ${t.count} deals · ${fmtMoney(t.arr)} ARR`:""}`)),
          h("button",{style:{marginLeft:"auto",textAlign:"right",background:"none",border:`1px solid ${T.divider2}`,color:t.cols.length?T.body:T.orange,cursor:"pointer",fontSize:"11px",padding:"4px 10px",maxWidth:"280px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}, onClick:()=>{expanded=open?null:slug;rerender();}}, t.cols.length?t.cols.join(" + "):"unmapped — click to map"));
        const rowWrap=h("div",{style:{borderBottom:`1px solid ${T.divider}`,padding:"8px 0"}}, rowTop);

      h("button",{style:{padding:"10px 18px",fontSize:"12px",fontWeight:600,cursor:"pointer",border:"1px solid #F7F6F4",background:"#F7F6F4",color:T.page}, onClick:()=>saveConfigAndRefresh(draft)},"Save & refresh"));

  function fill(){ list.innerHTML=""; const shown=cols.filter(c=>c.toLowerCase().includes(q.toLowerCase()));
    shown.forEach(c=>{ const on=selectedCols.includes(c);
      list.appendChild(h("label",{style:{display:"flex",alignItems:"center",gap:"6px",padding:"3px 0",cursor:"pointer",fontSize:"11px",color:on?T.text:T.body}, onClick:()=>onToggle(c)}, checkBox(on,13), c)); });
    if(!shown.length) list.appendChild(h("div",{style:{fontSize:"11px",color:T.muted,padding:"4px"}}, `No columns match “${q}”.`));
  }
  input.addEventListener("input",e=>{ q=e.target.value; fill(); });
  fill(); wrap.appendChild(input); wrap.appendChild(list); return wrap;
}
</script>
</body>
