  { id:"mktg", label:"Marketing" }, { id:"conv", label:"Conversion" },
  { id:"plat", label:"Platform & other" }, { id:"other", label:"Other" },

const DEFAULT_TYPES = {

  redo_managed_returns:{name:"Managed Returns",cloud:"relo",cols:["Managed Returns Revenue"]},
  oms:{name:"OMS",cloud:"ship",cols:["OMS Revenue"]},
  wms:{name:"WMS",cloud:"ship",cols:["WMS Revenue"]},

  post_purchase_upsell:{name:"Post-Purchase Upsell",cloud:"plat",cols:["Post-Purchase Upsell Revenue"]},

const START_MONTH = "2023-01";
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const keyToLabel = k => `${MONTH_NAMES[+k.split("-")[1]-1]} ’${k.slice(2,4)}`;
const addMonths = (k,n) => { let [y,m]=k.split("-").map(Number); m+=n; y+=Math.floor((m-1)/12); m=((m-1)%12)+1; return `${y}-${String(m).padStart(2,"0")}`; };
const monthDiff = (a,b) => { const [ay,am]=a.split("-").map(Number),[by,bm]=b.split("-").map(Number); return (by-ay)*12+(bm-am); };
const fmtMoney = v => { if(v==null||isNaN(v))return"—"; const a=Math.abs(v); if(a>=1e6)return`$${(v/1e6).toFixed(1)}M`; if(a>=1e3)return`$${(v/1e3).toFixed(0)}k`; return`$${Math.round(v)}`; };
const fmtMoneyFull = v => v==null||isNaN(v)?"—":v.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
const fmtPct = v => (v==null||!isFinite(v))?"—":`${Math.round(v*100)}%`;
const heat = pct => {
  if(pct==null)return{bg:"transparent",fg:T.muted};
  if(!isFinite(pct))return{bg:T.green,fg:T.page};
  if(pct<0.5)return{bg:"rgba(220,38,38,0.30)",fg:"#F5A399"};
  if(pct<0.75)return{bg:"rgba(220,38,38,0.15)",fg:"#DBA79F"};
  if(pct<0.9)return{bg:"rgba(155,154,150,0.14)",fg:"#C8C7C2"};
  if(pct<=1.1)return{bg:"rgba(22,163,74,0.18)",fg:"#7FCFA2"};
  if(pct<=1.5)return{bg:"rgba(22,163,74,0.34)",fg:"#9BE7B7"};
  return{bg:T.green,fg:T.page};
};
const prettify = s => s.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const nowMonthKey = () => new Intl.DateTimeFormat("en-CA",{timeZone:"America/Denver",year:"numeric",month:"2-digit"}).format(new Date()).slice(0,7);

/* ---------------- SQL generators ---------------- */
const DEALS="STAGING.HUBSPOT.STG_DEALS", REPORT="KITCHEN.PANTRY.INGR_MONTHLY_REPORT_V2", START="2023-01-01";
/* Closed-won bookings come only from the New Business (default) and XSell pipelines. */
const PIPES = "('default','702972541')";
const sq = s => `'${String(s).replace(/'/g,"''")}'`;
const qid = s => `"${String(s).replace(/"/g,'""')}"`;
const talias = slug => "t_"+slug.replace(/[^a-z0-9_]/gi,"_").toLowerCase();
const revExpr = cols => cols.length ? cols.map(c=>`ZEROIFNULL(${qid(c)})`).join(" + ") : "0";
const monthSpan = nowKey => { const [y,m]=nowKey.split("-").map(Number); return (y-2023)*12+(m-1)+1; };
/* Merchant-exclusion filters (fix: dropdown to drop merchants from the analysis).
   Applied to both the deals scan (by TEAM_ID) and the report scan (by Merchant ID). */
const notInTeam = ex => (ex && ex.length) ? `AND TEAM_ID NOT IN (${ex.map(sq).join(",")})` : "";
const notInMids = ex => (ex && ex.length) ? `AND ${qid("Merchant ID")} NOT IN (${ex.map(sq).join(",")})` : "";
function baseCTEs(types, span, excluded=[]){
  const slugs = types.map(t=>sq(t.slug)).join(",");
  return `
months AS (SELECT DATEADD(month, ROW_NUMBER() OVER (ORDER BY seq4())-1, DATE '${START}') AS m FROM TABLE(GENERATOR(ROWCOUNT => ${span}))),
report_mids AS (SELECT DISTINCT ${qid("Merchant ID")} AS mid FROM ${REPORT}),
deals AS (
  SELECT TEAM_ID AS mid, PRODUCT AS type, DEAL_AMOUNT AS arr,
         DATE_TRUNC('month', CONVERT_TIMEZONE('America/Denver', CLOSED_WON))::date AS close_m, DEAL_ID
  FROM ${DEALS}
  WHERE HS_IS_CLOSED_WON = TRUE AND CLOSED_WON IS NOT NULL AND TEAM_ID IS NOT NULL
    AND PIPELINE_ID IN ${PIPES}
    AND PRODUCT IN (${slugs}) AND CONVERT_TIMEZONE('America/Denver', CLOSED_WON) >= DATE '${START}'
    AND TEAM_ID IN (SELECT mid FROM report_mids) ${notInTeam(excluded)})`;
}
function revLongCTE(types, extraWhere=""){
  const inner = types.map(t=>`${revExpr(t.cols)} AS ${talias(t.slug)}`).join(",\n      ");
  const al = types.map(t=>talias(t.slug));
  const cases = types.map(t=>`WHEN ${sq(talias(t.slug))} THEN ${sq(t.slug)}`).join(" ");
  return `
rev_long AS (
  SELECT mid, m, CASE LOWER(typecol) ${cases} END AS type, rev
  FROM (SELECT ${qid("Merchant ID")} AS mid, ${qid("Date")} AS m, ${inner}
        FROM ${REPORT} WHERE ${qid("Date")} >= DATE '${START}' ${extraWhere})
  UNPIVOT (rev FOR typecol IN (${al.join(",")}))),
rev AS (SELECT mid, m, type, SUM(rev) AS rev FROM rev_long GROUP BY 1,2,3)`;
}
const qDealTypes = () => `SELECT PRODUCT AS slug, COUNT(*) AS n, ROUND(SUM(DEAL_AMOUNT)) AS arr, MAX(PRODUCT_CLOUD) AS product_cloud
  FROM ${DEALS} WHERE HS_IS_CLOSED_WON = TRUE AND CLOSED_WON IS NOT NULL AND PIPELINE_ID IN ${PIPES}
    AND CONVERT_TIMEZONE('America/Denver', CLOSED_WON) >= DATE '${START}' AND PRODUCT IS NOT NULL AND PRODUCT <> ''
  GROUP BY 1 ORDER BY n DESC`;
const qRevenueColumns = () => `SELECT column_name AS col FROM KITCHEN.INFORMATION_SCHEMA.COLUMNS
  WHERE table_schema='PANTRY' AND table_name='INGR_MONTHLY_REPORT_V2' AND column_name ILIKE '%Revenue%' ORDER BY ordinal_position`;
/* Cohort grid over ALL NB+XSell closed-won deals (matched or not, mapped type or
   not). Every deal counts toward its cohort's expected/ARR; only matched deals
   of a mapped type earn attributed revenue, so unmatched / zero-revenue deals
   attain $0 and drag the cohort down. ARR is summed across all deals (same-month
   deals coexist); revenue is credited once per merchant+type (latest cohort).
   Each (akey,type) group is the active deal from its close month until the next
   same-key deal closes (latest deal wins); a range-join to months expands only
   that window, avoiding a group-by-month cross product + ranking that timed out
   on the runtime warehouse. The report revenue scan is restricted to deal
   merchants (Merchant ID IN deals) because rev only feeds a LEFT JOIN onto deal
   rows here — unrestricted it re-unpivots every merchant's revenue on every page
   and pushed a single page over the 30s cap. (qTotalMapped keeps the full report
   scan; it needs every merchant for the orphaned-revenue total.) The Fridge
   Snowflake runtime hard-caps every query
   at 500 rows, but the grid is one row per (cohort, type, rep) and runs into the
   thousands — so this is fetched a page at a time via the QUALIFY ROW_NUMBER
   window (lo..hi over a stable cohort/type/rep order); fetchGridPaged loops until
   a short page comes back. Without paging, the runtime silently truncates to the
   first 500 rows and every later cohort disappears. NOTE: the Fridge Snowflake
   runtime rejects SQL that contains comments, so no block or line comments may
   appear inside these SQL template literals. */
const qGrid = (types, span, excluded=[], lo=1, hi=500) => `WITH
months AS (SELECT DATEADD(month, ROW_NUMBER() OVER (ORDER BY seq4())-1, DATE '${START}') AS m FROM TABLE(GENERATOR(ROWCOUNT => ${span}))),
lastm AS (SELECT MAX(m) AS m FROM months),
report_mids AS (SELECT DISTINCT ${qid("Merchant ID")} AS mid FROM ${REPORT}),
deals AS (
  SELECT TEAM_ID AS mid, COALESCE(NULLIF(PRODUCT,''),'(none)') AS type, DEAL_AMOUNT AS arr, DEAL_ID, COALESCE(NULLIF(AE_NAME,''),'—') AS rep,
    DATE_TRUNC('month', CONVERT_TIMEZONE('America/Denver', CLOSED_WON))::date AS close_m,
    CASE WHEN TEAM_ID IS NOT NULL AND TEAM_ID IN (SELECT mid FROM report_mids) THEN TEAM_ID ELSE 'deal:'||DEAL_ID END AS akey
  FROM ${DEALS}
  WHERE HS_IS_CLOSED_WON = TRUE AND CLOSED_WON IS NOT NULL AND PIPELINE_ID IN ${PIPES}
    AND CONVERT_TIMEZONE('America/Denver', CLOSED_WON) >= DATE '${START}' ${notInTeam(excluded)}),
grp AS (SELECT akey, mid, type, close_m, SUM(arr) AS arr, COUNT(DISTINCT DEAL_ID) AS ndeals, MAX_BY(rep, arr) AS rep FROM deals GROUP BY 1,2,3,4),
grp_win AS (SELECT mid, type, akey, close_m, arr, ndeals, rep,
    COALESCE(DATEADD(month,-1, LEAD(close_m) OVER (PARTITION BY akey, type ORDER BY close_m)), (SELECT m FROM lastm)) AS end_m
  FROM grp),
active AS (SELECT g.mid, g.type, g.close_m AS cohort, mo.m AS m, g.arr, g.ndeals, g.rep
  FROM grp_win g JOIN months mo ON mo.m >= g.close_m AND mo.m <= g.end_m),
${revLongCTE(types, `${notInMids(excluded)} AND ${qid("Merchant ID")} IN (SELECT mid FROM deals)`)},
joined AS (SELECT a.cohort, a.type, a.rep, a.m, a.arr/12 AS expected, COALESCE(r.rev,0) AS actual, a.ndeals
  FROM active a LEFT JOIN rev r ON r.mid=a.mid AND r.type=a.type AND r.m=a.m),
per_month AS (SELECT cohort, type, rep, m, SUM(expected) AS expected, SUM(actual) AS actual, SUM(ndeals) AS deals
  FROM joined GROUP BY 1,2,3,4)
SELECT TO_CHAR(cohort,'YYYY-MM') AS cohort, type, rep,
  ARRAY_AGG(ROUND(expected)::int) WITHIN GROUP (ORDER BY m) AS exp_arr,
  ARRAY_AGG(ROUND(actual)::int)   WITHIN GROUP (ORDER BY m) AS act_arr,
  ARRAY_AGG(deals)                WITHIN GROUP (ORDER BY m) AS cnt_arr
FROM per_month GROUP BY cohort, type, rep
QUALIFY ROW_NUMBER() OVER (ORDER BY cohort, type, rep) BETWEEN ${lo} AND ${hi}
ORDER BY cohort, type, rep`;
const qTotalMapped = (types, span, excluded=[]) => `WITH ${baseCTEs(types,span,excluded)},
${revLongCTE(types, notInMids(excluded))},
tm AS (SELECT type, m, SUM(rev) AS rev FROM rev GROUP BY 1,2)
SELECT tm.type, ARRAY_AGG(ROUND(ZEROIFNULL(tm.rev))::int) WITHIN GROUP (ORDER BY tm.m) AS rev_arr,
  ARRAY_AGG(TO_CHAR(tm.m,'YYYY-MM')) WITHIN GROUP (ORDER BY tm.m) AS mon_arr
FROM tm GROUP BY tm.type ORDER BY tm.type`;
/* Deal-level detail for a cohort cell: every deal in the cohort of the types in
   view (matched OR not). Superseded re-signs (a later deal for the same merchant
   + type) show inactive; unmatched deals (no Redo ID in the report) show $0. */
const qCellDeals = (mappedTypes, allSlugs, cohort, month, excluded=[]) => {
  const slugs = allSlugs.map(s=>sq(s)).join(",");
  const cd=`${cohort}-01`, md=`${month}-01`;
  return `WITH report_mids AS (SELECT DISTINCT ${qid("Merchant ID")} AS mid FROM ${REPORT}),
mnames AS (SELECT ${qid("Merchant ID")} AS mid, MAX_BY(${qid("Merchant Name")}, ${qid("Date")}) AS name FROM ${REPORT} WHERE ${qid("Date")} = DATE '${md}' GROUP BY 1),
alld AS (SELECT DEAL_ID, DEAL_NAME AS name, COALESCE(NULLIF(AE_NAME,''),'—') AS rep, TEAM_ID AS mid,
    COALESCE(NULLIF(PRODUCT,''),'(none)') AS type, DEAL_AMOUNT AS arr,
    DATE_TRUNC('month', CONVERT_TIMEZONE('America/Denver', CLOSED_WON))::date AS close_m,
    CASE WHEN TEAM_ID IS NOT NULL AND TEAM_ID IN (SELECT mid FROM report_mids) THEN 1 ELSE 0 END AS matched,
    CASE WHEN TEAM_ID IS NOT NULL AND TEAM_ID IN (SELECT mid FROM report_mids) THEN TEAM_ID ELSE 'deal:'||DEAL_ID END AS akey
  FROM ${DEALS} WHERE HS_IS_CLOSED_WON = TRUE AND CLOSED_WON IS NOT NULL AND PIPELINE_ID IN ${PIPES}
    AND CONVERT_TIMEZONE('America/Denver', CLOSED_WON) >= DATE '${START}' ${notInTeam(excluded)}),
cohort_deals AS (SELECT * FROM alld WHERE close_m = DATE '${cd}' AND type IN (${slugs})),
latest AS (SELECT akey, type, MAX(close_m) AS max_close FROM alld WHERE close_m <= DATE '${md}' GROUP BY 1,2),
${revLongCTE(mappedTypes, `AND ${qid("Date")} = DATE '${md}' ${notInMids(excluded)}`)},
alloc AS (SELECT cd.*, l.max_close, SUM(cd.arr) OVER (PARTITION BY cd.akey, cd.type) AS grp_arr
  FROM cohort_deals cd JOIN latest l ON l.akey=cd.akey AND l.type=cd.type)
SELECT a.name, a.rep, COALESCE(mn.name, a.mid, '—') AS merchant, a.type, ROUND(a.arr) AS arr,
  CASE WHEN a.max_close = DATE '${cd}' THEN ROUND(COALESCE(r.rev,0) * a.arr / NULLIF(a.grp_arr,0)) END AS actual,
  CASE WHEN a.max_close = DATE '${cd}' THEN 1 ELSE 0 END AS active, a.matched
FROM alloc a LEFT JOIN rev r ON r.mid=a.mid AND r.type=a.type LEFT JOIN mnames mn ON mn.mid=a.mid
ORDER BY a.arr DESC NULLS LAST LIMIT 500`; };
/* Orphaned-revenue drill-down (fix: click into Orphaned Revenue). For one month,
   the mapped-type report revenue from merchants that have NO closed-won deal of
   that type on or before the month — i.e. the revenue with no cohort behind it. */
const qOrphanDeals = (mappedTypes, month, excluded=[]) => {
  const md=`${month}-01`;
  return `WITH mnames AS (SELECT ${qid("Merchant ID")} AS mid, MAX_BY(${qid("Merchant Name")}, ${qid("Date")}) AS name FROM ${REPORT} WHERE ${qid("Date")} = DATE '${md}' GROUP BY 1),
dealset AS (SELECT DISTINCT TEAM_ID AS mid, COALESCE(NULLIF(PRODUCT,''),'(none)') AS type
  FROM ${DEALS} WHERE HS_IS_CLOSED_WON = TRUE AND CLOSED_WON IS NOT NULL AND PIPELINE_ID IN ${PIPES}
    AND TEAM_ID IS NOT NULL AND DATE_TRUNC('month', CONVERT_TIMEZONE('America/Denver', CLOSED_WON))::date <= DATE '${md}'),
${revLongCTE(mappedTypes, `AND ${qid("Date")} = DATE '${md}' ${notInMids(excluded)}`)},
orphan AS (SELECT r.mid, r.type, SUM(r.rev) AS rev FROM rev r LEFT JOIN dealset d ON d.mid=r.mid AND d.type=r.type
  WHERE d.mid IS NULL GROUP BY 1,2)
SELECT COALESCE(mn.name, o.mid, '—') AS merchant, o.type, ROUND(o.rev) AS rev
FROM orphan o LEFT JOIN mnames mn ON mn.mid=o.mid WHERE o.rev >= 1 ORDER BY o.rev DESC LIMIT 500`; };
/* Merchant roster for the exclude-merchants dropdown (fetched lazily on open). */
const qMerchants = () => `SELECT ${qid("Merchant ID")} AS mid, MAX_BY(${qid("Merchant Name")}, ${qid("Date")}) AS name,
  ROUND(SUM(ZEROIFNULL(${qid("Total Revenue")}))) AS rev
  FROM ${REPORT} GROUP BY 1 ORDER BY 3 DESC NULLS LAST`;

/* ---------------- data helpers ---------------- */
function toObj(row, cols){
  if(Array.isArray(row)){ const o={}; cols.forEach((c,i)=>o[c]=row[i]); return o; }
  const o={}; for(const k in row) o[k.toLowerCase()]=row[k]; return o;
}
const num = v => { if(v==null)return 0; if(typeof v==="number")return v; const n=Number(v); return isNaN(n)?0:n; };
function parseArr(v){ if(v==null)return[]; if(Array.isArray(v))return v.map(num);
  if(typeof v==="string"){ try{return JSON.parse(v).map(num);}catch{return[];} } return[]; }
function parseStrArr(v){ if(Array.isArray(v))return v.map(String);
  if(typeof v==="string"){ try{return JSON.parse(v).map(String);}catch{return[];} } return[]; }
async function runSql(sql, cols, limit=500){
  const res = await fridge.snowflake.query(sql, { limit });
  const rows = (res && res.rows) || [];
  return rows.map(r=>toObj(r,cols));
}
function seedConfig(){ const types={},order=[];
  for(const [slug,v] of Object.entries(DEFAULT_TYPES)){ types[slug]={name:v.name,cloud:v.cloud,cols:[...v.cols],on:true}; order.push(slug); }
  return {types,order}; }
function mergeDiscovery(config, disc){
  const cfg={ types:{...config.types}, order:[...config.order] };
  for(const dt of disc.dealTypes){
    if(!cfg.types[dt.slug]){ const def=DEFAULT_TYPES[dt.slug];
      cfg.types[dt.slug]= def?{name:def.name,cloud:def.cloud,cols:[...def.cols],on:true}:{name:prettify(dt.slug),cloud:"other",cols:[],on:false};
      cfg.order.push(dt.slug); }
    cfg.types[dt.slug].count=dt.n; cfg.types[dt.slug].arr=dt.arr;
  }
  return cfg;
}
/* Mapped types = enabled types with a revenue column (drive attributed revenue). */
const mappedTypes = config => config.order.filter(s=>config.types[s].on && config.types[s].cols && config.types[s].cols.length).map(s=>({slug:s,cols:config.types[s].cols}));
/* The type universe is every product type present in the grid (mapped or not). */
const gridTypes = data => (data && data.grid) ? [...new Set(data.grid.map(g=>g.type))] : [];
const typeCloud = (config,s)=> (config && config.types[s] && config.types[s].cloud) || "other";
const typeName = (config,s)=> (config && config.types[s] && config.types[s].name) || (s==="(none)" ? "(no product)" : prettify(s));
const cloudSlugs = (config, id) => (state.types||[]).filter(s=>typeCloud(config,s)===id);
const mappedCloudIds = config => CLOUDS.filter(cl=>(state.types||[]).some(s=>typeCloud(config,s)===cl.id));

async function discover(){
  const [dealTypes, revCols] = await Promise.all([
    runSql(qDealTypes(), ["slug","n","arr","product_cloud"]),
    runSql(qRevenueColumns(), ["col"]),
  ]);
  return { dealTypes: dealTypes.map(r=>({slug:r.slug,n:num(r.n),arr:num(r.arr)})), revCols: revCols.map(r=>r.col) };
}
/* The grid is one row per (cohort, type, rep) — thousands of rows — but the
   Fridge Snowflake runtime hard-caps every query at 500 rows. Page through it
   with the QUALIFY window in qGrid until a short page returns, so no cohort is
   silently dropped past row 500. Pages run sequentially (each stop condition
   depends on the previous page's length); the grid is cached afterward, so this
   only runs on an explicit Refresh. */
const GRID_COLS = ["cohort","type","rep","exp_arr","act_arr","cnt_arr"];
const GRID_PAGE = 500;
async function fetchGridPaged(mt, span, excluded){
  const out=[];
  for(let p=0; p<200; p++){
    const lo=p*GRID_PAGE+1, hi=(p+1)*GRID_PAGE;
    const rows = await runSql(qGrid(mt,span,excluded,lo,hi), GRID_COLS, GRID_PAGE);
    out.push(...rows);
    if(rows.length<GRID_PAGE) break;
  }
  return out;
}
async function refreshAll(config, nowKey, excluded=[]){
  const mt = mappedTypes(config);
  if(!mt.length) throw new Error("No deal types are mapped to a revenue column. Open Configure to map at least one.");
  const span = monthSpan(nowKey);
  const [grid, totalMapped] = await Promise.all([
    fetchGridPaged(mt, span, excluded),
    runSql(qTotalMapped(mt,span,excluded), ["type","rev_arr","mon_arr"]),
  ]);
  return {
    grid: grid.map(r=>({cohort:r.cohort, type:r.type, rep:r.rep||"—", exp:parseArr(r.exp_arr), act:parseArr(r.act_arr), cnt:parseArr(r.cnt_arr)})),
    totalMapped: totalMapped.map(r=>({type:r.type, rev:parseArr(r.rev_arr), months:parseStrArr(r.mon_arr)})),
    nowKey, refreshedAt: new Date().toISOString(),
  };
}
/* Re-query the grid with a set of merchants excluded (fix: exclude-merchants
   dropdown). The pre-aggregated grid can't drop a merchant client-side, so this
   round-trips with a NOT IN filter; the base cache is left untouched. */
async function gridWithExclusions(config, nowKey, excluded){
  const mt = mappedTypes(config);
  const span = monthSpan(nowKey);
  const [grid, totalMapped] = await Promise.all([
    fetchGridPaged(mt, span, excluded),
    runSql(qTotalMapped(mt,span,excluded), ["type","rev_arr","mon_arr"]),
  ]);
  return {
    grid: grid.map(r=>({cohort:r.cohort, type:r.type, rep:r.rep||"—", exp:parseArr(r.exp_arr), act:parseArr(r.act_arr), cnt:parseArr(r.cnt_arr)})),
    totalMapped: totalMapped.map(r=>({type:r.type, rev:parseArr(r.rev_arr), months:parseStrArr(r.mon_arr)})),
  };
}
const STORE = { config:"attainment_config", data:"attainment_data" };
async function saveConfig(c){ await fridge.db.collection(STORE.config).create({value:c},"v1"); }
async function loadConfig(){ try{ const d=await fridge.db.collection(STORE.config).list(); const doc=d.find(x=>x.key==="v1")||d[0]; return doc?(doc.value?.value||doc.value):null; }catch{return null;} }
/* The cohort grid is far larger than fridge.db's 64 KB/doc limit, so the cache
   is chunked: a "latest" manifest doc plus grid_N docs. Chunks are sized by
   BYTES (~48 KB, under the 64 KB doc cap) rather than a fixed row count, which
   keeps the chunk count low — fridge.db list() only returns the 100 most-recent
   docs, so a fixed 25-row chunking would silently start dropping chunks (and
   whole cohorts) once the grid passed ~2.5k rows. The manifest records the total
   row count so loadData can reject an incomplete read and fall back to a live
   query instead of rendering a grid with cohorts missing. */
const CHUNK_BYTES = 48000;
async function saveData(x){
  const col = fridge.db.collection(STORE.data);
  const chunks=[]; let cur=[], curBytes=0;
  for(const row of x.grid){
    const b = JSON.stringify(row).length;
    if(cur.length && curBytes+b>CHUNK_BYTES){ chunks.push(cur); cur=[]; curBytes=0; }
    cur.push(row); curBytes+=b;
  }
  if(cur.length) chunks.push(cur);
  for(let i=0;i<chunks.length;i++) await col.create({value:chunks[i]}, "grid_"+i);
  await col.create({value:{ v:5, chunks:chunks.length, rows:x.grid.length, totalMapped:x.totalMapped,
    nowKey:x.nowKey, refreshedAt:x.refreshedAt }}, "latest");
}
async function loadData(){
  try{
    const docs = await fridge.db.collection(STORE.data).list();
    const map = {}; for(const d of docs) map[d.key] = (d.value && d.value.value!==undefined) ? d.value.value : d.value;
    const man = map["latest"]; if(!man || man.v!==5) return null;
    const grid=[]; for(let i=0;i<man.chunks;i++){ const c=map["grid_"+i]; if(Array.isArray(c)) grid.push(...c); }
    // Reject a partial cache (a dropped/missing chunk) so we re-query instead of
    // silently showing a grid with cohorts missing — the bug this guards against.
    if(typeof man.rows==="number" && grid.length!==man.rows) return null;
    return { grid, totalMapped:man.totalMapped, nowKey:man.nowKey, refreshedAt:man.refreshedAt };
  }catch{ return null; }
}

/* A deal type is "unmeasured" when it has no mapped revenue column (excluded
   types, empty PRODUCT, or discovered-but-unmapped). Such deals always belong
   in the no-match/reconciliation bucket regardless of the selection. */
const isUnmappedType = (config, t) => !(config && config.types[t] && config.types[t].cols && config.types[t].cols.length);

/* ---------------- model ---------------- */
function computeModel(data, selected, config, opts={}){
  const repFilter = opts.repFilter || "__all__";
  const excludeM0 = !!opts.excludeM0;
  const series = data.grid.filter(s=>selected.has(s.type) && (repFilter==="__all__" || s.rep===repFilter));
  let last = START_MONTH;
  for(const s of data.grid){ const end=addMonths(s.cohort, s.exp.length-1); if(end>last) last=end; }
  if(data.nowKey && data.nowKey>last) last=data.nowKey;
  const MONTHS=[]; for(let k=START_MONTH;k<=last;k=addMonths(k,1)) MONTHS.push(k);
  const MIDX=Object.fromEntries(MONTHS.map((m,i)=>[m,i]));
  const detailMonth=addMonths(last,-1);
  const cohorts=[...new Set(series.map(s=>s.cohort))].sort();
  const rows=[]; let maxSpan=0;
  for(const c of cohorts){
    const cs=series.filter(s=>s.cohort===c); if(!cs.length)continue;
    const span=monthDiff(c,last)+1;
    const exp=Array(span).fill(0),act=Array(span).fill(0),dls=Array(span).fill(0);
    let arr=0,deals0=0;
    for(const s of cs){ arr+=(s.exp[0]||0)*12; deals0+=(s.cnt[0]||0);
      s.exp.forEach((v,i)=>{if(i<span)exp[i]+=v;}); s.act.forEach((v,i)=>{if(i<span)act[i]+=v;}); s.cnt.forEach((v,i)=>{if(i<span)dls[i]+=v;}); }
    if(deals0===0 && arr===0 && act.every(v=>v===0)) continue;
    maxSpan=Math.max(maxSpan,span); rows.push({c,span,exp,act,dls,arr,deals0});
  }
  const ATTR={};
  for(const s of data.grid){ if(!ATTR[s.type])ATTR[s.type]=Array(MONTHS.length).fill(0);
    const base=MIDX[s.cohort]; if(base==null)continue;
    s.act.forEach((v,i)=>{const mi=base+i; if(mi<MONTHS.length)ATTR[s.type][mi]+=v;}); }
  const REVT={};
  for(const t of data.totalMapped){ const arr=Array(MONTHS.length).fill(0);
    t.months.forEach((mk,i)=>{const mi=MIDX[mk]; if(mi!=null)arr[mi]=t.rev[i]||0;}); REVT[t.type]=arr; }
  const unatt=MONTHS.map((_,mi)=>{ let u=0; selected.forEach(t=>{u+=Math.max(0,(REVT[t]?.[mi]||0)-(ATTR[t]?.[mi]||0));}); return u; });
  let se=0,sa=0,jE=0,jA=0,totArr=0,totDeals=0; const jIdx=MIDX[detailMonth];
  for(const r of rows){ totArr+=r.arr; totDeals+=r.deals0;
    r.exp.forEach((e,i)=>{ if(excludeM0 && i===0) return; const mi=MIDX[r.c]+i;
      if(mi<MONTHS.length-1){se+=e;sa+=r.act[i];} if(mi===jIdx){jE+=e;jA+=r.act[i];} }); }
  const reps = [...new Set(data.grid.map(s=>s.rep||"—"))].sort((a,b)=>a.localeCompare(b));
  return { rows, maxSpan, unatt, MONTHS, MIDX, last, detailMonth, cohorts, reps, excludeM0, repFilter,
    overall: se>0?sa/se:null, junPct: jE>0?jA/jE:null, totArr, totDeals };
}

/* ---------------- tiny DOM helper ---------------- */
function h(tag, props, ...kids){
  const el=document.createElement(tag);
  if(props){ for(const k in props){ const v=props[k];
    if(k==="style" && v && typeof v==="object") Object.assign(el.style,v);
    else if(k==="class") el.className=v;
    else if(k==="html") el.innerHTML=v;
    else if(k.startsWith("on") && typeof v==="function") el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="title") el.title=v;
    else if(v!=null && v!==false) el.setAttribute(k,v);
  }}
  for(const kid of kids.flat()){ if(kid==null||kid===false)continue;
    el.appendChild(typeof kid==="object"?kid:document.createTextNode(String(kid))); }
  return el;
}

let fridge=null, user=null;

const defaultSelection = (cfg, data) => { const gt=gridTypes(data); return new Set(gt.length ? gt : cfg.order.filter(s=>cfg.types[s].cols && cfg.types[s].cols.length)); };
function setState(patch){ Object.assign(state, patch); render(); }

/* ---------------- actions ---------------- */
async function doRefresh(cfgOverride){
  if(!fridge) return;
  const cfg = cfgOverride || state.config;
  setState({ phase:"busy", error:null, busyMsg:"Discovering deal types & revenue columns…" });
  try{
    const disc = await discover();
    const merged = mergeDiscovery(cfg, disc);
    try{ await saveConfig(merged); }catch(e){ console.warn("config cache failed", e); }
    setState({ discovered:disc, config:merged, busyMsg:"Querying Snowflake — cohort grid, revenue totals, no-match…" });
    const fresh = await refreshAll(merged, nowMonthKey());
    const selected = state.selected.size ? state.selected : defaultSelection(merged, fresh);
    setState({ data:fresh, selected, phase:"ready", busyMsg:"" });
    // cache is best-effort: a failed write must never break a completed refresh
    try{ await saveData(fresh); }catch(e){ console.warn("data cache failed", e); }
    // a full refresh re-queries the full dataset; re-apply any active exclusions on top
    if(state.excluded.size) await applyExclusions();
  }catch(e){
    setState({ error:String(e?.message||e), phase: state.data?"ready":"error", busyMsg:"" });
  }
}
/* Re-run the grid with the current merchant exclusions and swap it into the live
   data (base cache is preserved so clearing exclusions restores instantly). */
async function applyExclusions(){
  if(!fridge || !state.config || !state.data) return;
  const ex=[...state.excluded];
  setState({ phase:"busy", error:null, busyMsg: ex.length?`Recomputing without ${ex.length} merchant${ex.length>1?"s":""}…`:"Restoring all merchants…" });
  try{
    const filtered = await gridWithExclusions(state.config, state.data.nowKey, ex);
    setState({ data:{...state.data, grid:filtered.grid, totalMapped:filtered.totalMapped}, phase:"ready", busyMsg:"" });
  }catch(e){
    setState({ error:String(e?.message||e), phase:"ready", busyMsg:"" });
  }
}
async function loadMerchants(){
  if(!fridge || state.merchants) return;
  setState({ merchantsLoading:true });
  try{
    const rows = await runSql(qMerchants(), ["mid","name","rev"], 20000);
    const merchants = rows.filter(r=>r.mid).map(r=>({mid:String(r.mid), name:r.name||String(r.mid), rev:num(r.rev)}));
    setState({ merchants, merchantsLoading:false });
  }catch(e){
    setState({ merchants:[], merchantsLoading:false, error:String(e?.message||e) });
  }
}
async function saveConfigAndRefresh(newCfg){
  try{ await saveConfig(newCfg); }catch(e){ console.warn("config cache failed", e); }
  setState({ config:newCfg, selected:new Set(), drawer:false });
  await doRefresh(newCfg);
}

/* ---------------- boot ---------------- */
(async function boot(){
  try{
    const mod = await import("/api/sdk");
    fridge = mod.createFridge();
    try{ user = await fridge.identity.me(); }catch{}
    const savedCfg = await loadConfig();
    const cfg = (savedCfg && savedCfg.order) ? savedCfg : seedConfig();
    const cached = await loadData();
    if(cached && cached.grid){ setState({ config:cfg, data:cached, selected:defaultSelection(cfg, cached), phase:"ready" }); }
    else { setState({ config:cfg, phase:"needsConnect" }); }
  }catch(e){ setState({ error:String(e?.message||e), phase:"error" }); }
})();

function render(){
  const app = document.getElementById("app");
  app.innerHTML="";
  app.appendChild(Header());
  const main = h("main",{style:{maxWidth:"1440px",margin:"0 auto",padding:"24px 48px 64px"}});
  if(state.error) main.appendChild(ErrorBanner(state.error));

  if(state.phase==="init") main.appendChild(Splash("Connecting to Fridge runtime…"));
  else if(state.phase==="error" && !state.data) main.appendChild(Splash("Could not load. Check Snowflake access, then Refresh.", "error"));
  else if(state.phase==="needsConnect") main.appendChild(ConnectCard());
  else if(state.phase==="busy" && !state.data) main.appendChild(Splash(state.busyMsg||"Working…", "spin"));

  if(state.data && state.config){
    const cloudOrder = Object.fromEntries(CLOUDS.map((c,i)=>[c.id,i]));
    state.types = gridTypes(state.data).sort((a,b)=>{
      const ca=cloudOrder[typeCloud(state.config,a)]??9, cb=cloudOrder[typeCloud(state.config,b)]??9;
      return ca-cb || typeName(state.config,a).localeCompare(typeName(state.config,b)); });
    const model = computeModel(state.data, state.selected, state.config, {repFilter:state.repFilter, excludeM0:state.excludeM0});
    state._model = model;
    if(state.phase==="busy") main.appendChild(h("div",{style:{fontSize:"12px",color:T.orange,marginBottom:"16px",display:"flex",gap:"8px",alignItems:"center"}}, spinIcon(), state.busyMsg));
    main.appendChild(ScopeBar(model));
    main.appendChild(ControlsBar(model));
    main.appendChild(StatStrip(model));
    main.appendChild(h("div",{style:{marginTop:"24px"}}, CohortTable(model)));
    main.appendChild(FooterNote());
  }
  app.appendChild(main);
  renderOverlay();
}

/* Project a partial current month to a full-month run-rate: scale MTD by
   (days in month ÷ days elapsed) in America/Denver. */
function projFactor(){
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Denver",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const y=+p.find(x=>x.type==="year").value, mo=+p.find(x=>x.type==="month").value, d=+p.find(x=>x.type==="day").value;
  const dim=new Date(y,mo,0).getDate();
  return d>0?dim/d:1;
}
function CohortTable(model){
  const cal = state.view==="cal";
  const curMonth = state.data.nowKey;
  const factor = (cal && state.project) ? projFactor() : 1;
  const projectCol = key => cal && state.project && key===curMonth;
  // Orphaned revenue has no rep, so it only makes sense in the all-reps view.
  const showOrphan = state.repFilter==="__all__";
  // Default to Jan '25 onward in calendar view; button reveals earlier months.
  let months = model.MONTHS;
  if(cal && !state.showEarly) months = months.filter(m=>m>="2025-01");
  const columns = cal
    ? months.map(m=>({key:m,label:m===curMonth?(state.project?"Projected":"MTD"):keyToLabel(m)}))
    : Array.from({length:model.maxSpan},(_,i)=>({key:i,label:`M${i}`}));
  const thBase={position:"sticky",top:0,zIndex:2,background:T.surface,fontSize:"10px",fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:T.muted,padding:"8px",borderBottom:`2px solid ${T.divider2}`,textAlign:"right",whiteSpace:"nowrap"};
  const num={fontSize:"11px",fontVariantNumeric:"tabular-nums",textAlign:"right",padding:"8px",borderBottom:`1px solid ${T.divider}`,whiteSpace:"nowrap",color:T.body};
  // Sticky first three columns (Cohort, Closed Run-Rate, Deals).
  const W={coh:150,arr:118,dl:64}; const Lc=0, La=W.coh, Ld=W.coh+W.arr;
  const stTh=(left,w)=>({...thBase,left:`${left}px`,zIndex:6,minWidth:`${w}px`,width:`${w}px`});
  const stTd=(left,w,bg,extra)=>({...num,position:"sticky",left:`${left}px`,zIndex:3,background:bg,minWidth:`${w}px`,width:`${w}px`,...(extra||{})});
  const stLabel=(bg,extra)=>({position:"sticky",left:"0px",zIndex:3,background:bg,padding:"8px 16px",borderBottom:`1px solid ${T.divider}`,fontWeight:600,fontSize:"13px",whiteSpace:"nowrap",width:`${W.coh}px`,minWidth:`${W.coh}px`,...(extra||{})});
  const table=h("table",{style:{borderCollapse:"separate",borderSpacing:0,width:"100%",minWidth:`${W.coh+W.arr+W.dl+columns.length*72}px`}});
  const thead=h("tr",null,
    h("th",{style:{...thBase,textAlign:"left",left:0,zIndex:6,minWidth:`${W.coh}px`,width:`${W.coh}px`,paddingLeft:"16px"}},"Cohort"),
    h("th",{style:stTh(La,W.arr)},"Closed Run-Rate"),
    h("th",{style:stTh(Ld,W.dl)},"Deals"),
    columns.map(c=>h("th",{style:{...thBase,minWidth:"64px"}}, c.label)));
  table.appendChild(h("thead",null,thead));
  const tbody=h("tbody");

  // Total row (fix): sums every cohort below + Orphaned revenue.
  const totBg=T.surfaceAlt, totBorder={borderBottom:`2px solid ${T.divider2}`};
  const totTr=h("tr",{style:{background:totBg}});
  totTr.appendChild(h("td",{style:stLabel(totBg,{color:T.text,...totBorder}), title:`All cohorts combined${showOrphan?", plus Orphaned revenue (calendar view)":" (Orphaned revenue is excluded while a rep is selected)"}. Respects the current product / rep / merchant filters and the Exclude-M0 toggle.`},"Total"));
  totTr.appendChild(h("td",{style:stTd(La,W.arr,totBg,{color:T.text,fontWeight:600,...totBorder})}, fmtMoney(model.totArr)));
  totTr.appendChild(h("td",{style:stTd(Ld,W.dl,totBg,{color:T.text,fontWeight:600,...totBorder})}, model.totDeals?model.totDeals.toLocaleString():"—"));
  columns.forEach(col=>{
    if(!cal && state.excludeM0 && col.key===0){ totTr.appendChild(h("td",{style:{...num,...totBorder,color:"rgba(255,255,255,0.14)"}},"·")); return; }
    let e=0,a=0;
    for(const r of model.rows){ const i = cal?monthDiff(r.c,col.key):col.key;
      if(i<0||i>=r.span) continue; if(state.excludeM0 && i===0) continue; e+=r.exp[i]||0; a+=r.act[i]||0; }
    if(cal && showOrphan) a += model.unatt[model.MIDX[col.key]]||0;
    if(projectCol(col.key)) a *= factor;
    const pct = e>0?a/e:(a>0?Infinity:null);
    if(e<=0 && a===0){ totTr.appendChild(h("td",{style:{...num,...totBorder,color:"rgba(255,255,255,0.14)"}},"·")); return; }
    const hh=heat(pct);
    totTr.appendChild(h("td",{style:{...num,...totBorder,background:hh.bg,color:hh.fg,fontWeight:700}, title:`Total ${cal?keyToLabel(col.key):col.label}\nExpected ${fmtMoneyFull(e)} · Actual ${fmtMoneyFull(a)}`},
      state.metric==="pct"?(pct===Infinity?"∞":fmtPct(pct)):fmtMoney(a)));
  });
  tbody.appendChild(totTr);

  model.rows.forEach((r,ri)=>{
    const rowBg = ri%2?T.surface:T.surfaceAlt;
    const tr=h("tr",{style:{background:rowBg}});
    tr.appendChild(h("td",{style:{...stLabel(rowBg,{color:T.text})}}, keyToLabel(r.c)));
    tr.appendChild(h("td",{style:stTd(La,W.arr,rowBg)}, fmtMoney(r.arr)));
    tr.appendChild(h("td",{style:stTd(Ld,W.dl,rowBg)}, r.deals0||"—"));
    columns.forEach(col=>{
      const i = cal?monthDiff(r.c,col.key):col.key;
      if(i<0||i>=r.span){ tr.appendChild(h("td",{style:{...num,color:"rgba(255,255,255,0.14)"}},"·")); return; }
      let e=r.exp[i]??0, a=r.act[i]??0; const d=r.dls[i]??0;
      if(e<=0 && a===0){ tr.appendChild(h("td",{style:{...num,color:"rgba(255,255,255,0.14)"}},"·")); return; }
      const m = cal?col.key:addMonths(r.c,i);
      if(projectCol(m)) a *= factor;
      const pct = e>0?a/e:(a>0?Infinity:null); const hh=heat(pct);
      const cell=h("button",{class:"cell", title:`${keyToLabel(r.c)} cohort · ${keyToLabel(m)}${projectCol(m)?" · projected":""}\nExpected ${fmtMoneyFull(e)} · Actual ${fmtMoneyFull(a)} · ${d} active`,
        style:{width:"100%",border:"none",cursor:"pointer",background:hh.bg,color:hh.fg,fontVariantNumeric:"tabular-nums",fontSize:"11px",fontWeight:600,padding:"6px",textAlign:"right"},
        onClick:()=>setState({modal:{kind:"cell",cohort:r.c,month:m}})},
        state.metric==="pct"?(pct===Infinity?"∞":fmtPct(pct)):fmtMoney(a));
      tr.appendChild(h("td",{style:{padding:"2px",borderBottom:`1px solid ${T.divider}`}}, cell));
    });
    tbody.appendChild(tr);
  });
  // Orphaned revenue row — mapped revenue from merchants with no deal of that type (calendar only). Click a cell for the merchant list.
  if(showOrphan){
  const unTr=h("tr",{style:{background:T.surface}});
  const utTop={borderTop:`2px solid ${T.divider2}`};
  unTr.appendChild(h("td",{style:stLabel(T.surface,{color:T.blue,...utTop}), title:"Orphaned revenue — mapped-column revenue from merchants with no closed-won deal of that type. This is the only revenue not tied to a deal (calendar view). Click a cell to see the merchants."},"Orphaned revenue · no deal"));
  unTr.appendChild(h("td",{style:stTd(La,W.arr,T.surface,utTop)},"—"));
  unTr.appendChild(h("td",{style:stTd(Ld,W.dl,T.surface,utTop)},"—"));
  columns.forEach(c=>{
    if(!cal){ unTr.appendChild(h("td",{style:{...num,...utTop,color:"rgba(255,255,255,0.14)"}},"·")); return; }
    let v=model.unatt[model.MIDX[c.key]]||0;
    if(projectCol(c.key)) v *= factor;
    if(v<1){ unTr.appendChild(h("td",{style:{...num,...utTop,color:"rgba(255,255,255,0.14)"}},"·")); return; }
    const btn=h("button",{class:"cell", title:`Orphaned revenue · ${keyToLabel(c.key)}${projectCol(c.key)?" · projected":""}\n${fmtMoneyFull(v)} — click for merchants`,
      style:{width:"100%",border:"none",cursor:"pointer",background:"transparent",color:T.blue,fontVariantNumeric:"tabular-nums",fontSize:"11px",fontWeight:600,padding:"6px",textAlign:"right"},
      onClick:()=>setState({modal:{kind:"orphan",month:c.key}})}, fmtMoney(v));
    unTr.appendChild(h("td",{style:{padding:"2px",...utTop,borderBottom:`1px solid ${T.divider}`}}, btn));
  });
  tbody.appendChild(unTr);
  }
  table.appendChild(tbody);
  return h("div",{style:{background:T.surface,border:`1px solid ${T.divider}`,overflow:"auto",maxHeight:"70vh"}}, table);
}

/* ---------------- overlay: modals + drawer ---------------- */
function renderOverlay(){
  const ov=document.getElementById("overlay"); ov.innerHTML="";
  if(state.drawer && state.config) ov.appendChild(ConfigDrawer());
  if(state.modal?.kind==="cell" && state._model) ov.appendChild(CellModal(state.modal));
  if(state.modal?.kind==="orphan" && state._model) ov.appendChild(OrphanModal(state.modal));
}
const mtd={padding:"8px 16px",borderBottom:`1px solid ${T.divider}`,fontSize:"12px"};
const mtdNum={...mtd,fontVariantNumeric:"tabular-nums",textAlign:"right",whiteSpace:"nowrap"};
const thM=(right)=>({fontSize:"9px",fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:T.muted,textAlign:right?"right":"left",padding:"8px 16px",borderBottom:`2px solid ${T.divider2}`,position:"sticky",top:0,background:T.surface,zIndex:1});
function ModalShell(eyebrow,title,subtitle,body,onClose){
  const shell=h("div",{style:{position:"relative",background:T.surface,border:`1px solid ${T.divider2}`,width:"min(960px, 100%)",maxHeight:"85vh",display:"flex",flexDirection:"column",color:T.body}},
    h("div",{style:{padding:"24px",borderBottom:`1px solid ${T.divider}`,display:"flex",alignItems:"flex-start",gap:"16px"}},
      h("div",{style:{marginRight:"auto"}},
        h("div",{style:{fontSize:"10px",fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:T.muted}},eyebrow),
        h("div",{style:{fontFamily:SERIF,fontSize:"28px",lineHeight:"32px",color:T.text,marginTop:"4px"}},title),
        subtitle),
      h("button",{style:{background:"none",border:"none",cursor:"pointer",color:T.muted}, onClick:onClose}, icon(IC.x,18))),
    h("div",{style:{overflowY:"auto"}}, body));
  return h("div",{style:{position:"fixed",inset:0,zIndex:60,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}},
    h("div",{style:{position:"absolute",inset:0,background:"rgba(13,13,13,0.72)"}, onClick:onClose}), shell);
}
function CellModal(m){
  const model=state._model, cfg=state.config;
  const row=model.rows.find(r=>r.c===m.cohort);
  const i=row?monthDiff(m.cohort,m.month):-1;
  const e=row&&i>=0&&i<row.span?row.exp[i]:0, a=row&&i>=0&&i<row.span?row.act[i]:0, d=row&&i>=0&&i<row.span?row.dls[i]:0;
  const pct=e>0?a/e:null;
  const subtitle=h("div",{style:{fontSize:"12px",color:T.muted,marginTop:"8px",fontVariantNumeric:"tabular-nums"}},
    `Cell: expected ${fmtMoneyFull(e)} · actual ${fmtMoneyFull(a)} · `,
    h("span",{style:{color:T.text,fontWeight:600}}, `${fmtPct(pct)} attained`), ` · ${d} active in view`);
  const body=h("div");
  body.appendChild(h("div",{style:{padding:"16px 24px 0",fontSize:"12px",color:T.muted,lineHeight:"20px"}},
    `Every closed-won deal in this cohort for the deal types in view, with revenue attributed for ${keyToLabel(m.month)} (latest deal wins; superseded re-signs are dimmed). Queried live from Snowflake.`));
  const slot=h("div",{style:{padding:"48px",textAlign:"center",color:T.muted,fontSize:"13px",display:"flex",gap:"10px",justifyContent:"center",alignItems:"center"}}, spinIcon(), "Querying deals…");
  body.appendChild(slot);
  const close=()=>setState({modal:null});
  // fire live query — all deals in the cohort of the selected types (matched or not)
  const allSlugs=(state.types||[]).filter(s=>state.selected.has(s));
  const mt=mappedTypes(cfg).filter(t=>state.selected.has(t.slug));
  (async()=>{
    try{
      if(!allSlugs.length){ slot.replaceWith(emptyCell()); return; }
      let rows=await runSql(qCellDeals(mt,allSlugs,m.cohort,m.month,[...state.excluded]), ["name","rep","merchant","type","arr","actual","active","matched"]);
      if(state.repFilter!=="__all__") rows=rows.filter(r=>(r.rep||"—")===state.repFilter);
      slot.replaceWith(CellTable(rows,m.month,cfg));
    }catch(err){
      const box=h("div",{style:{margin:"12px 24px",border:`1px solid ${T.red}`,background:"rgba(220,38,38,0.10)",padding:"10px 14px",fontSize:"12px",color:"#F5A399"}}, String(err?.message||err));
      slot.replaceWith(box);
    }
  })();
  return ModalShell("Deal-level detail · live", `${keyToLabel(m.cohort)} cohort · ${keyToLabel(m.month)}`, subtitle, body, close);
}
function emptyCell(){ return h("div",{style:{...mtd,textAlign:"center",color:T.muted,padding:"32px"}},"No matched deals for this cohort in the current deal-type view."); }
function CellTable(rows, month, cfg){
  const table=h("table",{style:{width:"100%",borderCollapse:"collapse",marginTop:"8px"}});
  table.appendChild(h("thead",null,h("tr",null,
    h("th",{style:thM()},"Deal"),h("th",{style:thM()},"Rep"),h("th",{style:thM()},"Merchant"),h("th",{style:thM()},"Type"),
    h("th",{style:thM(1)},"Deal ARR"),h("th",{style:thM(1)},"Expected / mo"),h("th",{style:thM(1)},`Actual (${keyToLabel(month)})`),h("th",{style:thM(1)},"Attainment"))));
  const tb=h("tbody");
  rows.forEach(r=>{
    const active=Number(r.active)===1, arr=num(r.arr), actual=r.actual==null?null:num(r.actual), expected=arr/12;
    const p=active&&expected>0&&actual!=null?actual/expected:null; const hh=heat(p);
    const unmatched=Number(r.matched)!==1;
    tb.appendChild(h("tr",{style:{opacity:active?1:0.4}},
      h("td",{style:{...mtd,color:T.text}}, r.name,
        !active?h("span",{style:{fontSize:"9px",color:T.muted}}," · superseded")
        :(unmatched?h("span",{style:{fontSize:"9px",color:T.orange}}," · no Redo ID match"):null)),
      h("td",{style:mtd}, r.rep||"—"),
      h("td",{style:mtd}, r.merchant),
      h("td",{style:mtd}, typeName(cfg,r.type)),
      h("td",{style:mtdNum}, fmtMoneyFull(arr)),
      h("td",{style:mtdNum}, fmtMoneyFull(expected)),
      h("td",{style:mtdNum}, active&&actual!=null?fmtMoneyFull(actual):"—"),
      h("td",{style:mtdNum}, p!=null?h("span",{style:{background:hh.bg,color:hh.fg,padding:"2px 8px",fontWeight:600}}, fmtPct(p)):"—")));
  });
  if(!rows.length) tb.appendChild(h("tr",null,h("td",{colspan:8,style:{...mtd,textAlign:"center",color:T.muted,padding:"32px"}},"No matched deals for this cohort in the current deal-type view.")));
  table.appendChild(tb);
  return table;
}
/* Orphaned-revenue drill-down (fix): merchants generating mapped revenue with no
   closed-won deal of that type behind it, for one calendar month. */
function OrphanModal(m){
  const cfg=state.config, model=state._model;
  const total=model.unatt[model.MIDX[m.month]]||0;
  const subtitle=h("div",{style:{fontSize:"12px",color:T.muted,marginTop:"8px",fontVariantNumeric:"tabular-nums"}},
    `Total orphaned in view: `, h("span",{style:{color:T.blue,fontWeight:600}}, fmtMoneyFull(total)));
  const body=h("div");
  body.appendChild(h("div",{style:{padding:"16px 24px 0",fontSize:"12px",color:T.muted,lineHeight:"20px"}},
    `Mapped-column revenue for ${keyToLabel(m.month)} from merchants with no closed-won NB+XSell deal of that type on or before the month — the revenue with no cohort behind it. Queried live from Snowflake.`));
  const slot=h("div",{style:{padding:"48px",textAlign:"center",color:T.muted,fontSize:"13px",display:"flex",gap:"10px",justifyContent:"center",alignItems:"center"}}, spinIcon(), "Querying merchants…");
  body.appendChild(slot);
  const close=()=>setState({modal:null});
  const mt=mappedTypes(cfg).filter(t=>state.selected.has(t.slug));
  (async()=>{
    try{
      if(!mt.length){ slot.replaceWith(h("div",{style:{...mtd,textAlign:"center",color:T.muted,padding:"32px"}},"No mapped deal types in the current view.")); return; }
      const rows=await runSql(qOrphanDeals(mt,m.month,[...state.excluded]), ["merchant","type","rev"]);
      slot.replaceWith(OrphanTable(rows,cfg));
    }catch(err){
      const box=h("div",{style:{margin:"12px 24px",border:`1px solid ${T.red}`,background:"rgba(220,38,38,0.10)",padding:"10px 14px",fontSize:"12px",color:"#F5A399"}}, String(err?.message||err));
      slot.replaceWith(box);
    }
  })();
  return ModalShell("Orphaned revenue · live", `${keyToLabel(m.month)} · no deal behind it`, subtitle, body, close);
}
function OrphanTable(rows, cfg){
  const table=h("table",{style:{width:"100%",borderCollapse:"collapse",marginTop:"8px"}});
  table.appendChild(h("thead",null,h("tr",null,
    h("th",{style:thM()},"Merchant"),h("th",{style:thM()},"Revenue type"),h("th",{style:thM(1)},"Revenue"))));
  const tb=h("tbody");
  const tot=rows.reduce((s,r)=>s+num(r.rev),0);
  rows.forEach(r=>{
    tb.appendChild(h("tr",null,
      h("td",{style:{...mtd,color:T.text}}, r.merchant),
      h("td",{style:mtd}, typeName(cfg,r.type)),
      h("td",{style:mtdNum,}, fmtMoneyFull(num(r.rev)))));
  });
  if(!rows.length) tb.appendChild(h("tr",null,h("td",{colspan:3,style:{...mtd,textAlign:"center",color:T.muted,padding:"32px"}},"No orphaned revenue for this month in the current view.")));
  else tb.appendChild(h("tr",{style:{borderTop:`2px solid ${T.divider2}`}},
    h("td",{style:{...mtd,color:T.text,fontWeight:600}},`${rows.length} merchant${rows.length>1?"s":""}`),
    h("td",{style:mtd},""),
    h("td",{style:{...mtdNum,color:T.blue,fontWeight:700}}, fmtMoneyFull(tot))));
  table.appendChild(tb);
  return table;
}
/* ---------------- config drawer ---------------- */
function cloneCfg(config){ const types={}; for(const k in config.types) types[k]={...config.types[k],cols:[...config.types[k].cols]}; return {types,order:[...config.order]}; }
function ConfigDrawer(){
  let draft=cloneCfg(state.config);
  let expanded=null;
  const close=()=>setState({drawer:false});
  const rerender=()=>{ const fresh=build(); panel.replaceWith(fresh); panel=fresh; };
  function availableCols(){ const s=new Set(state.discovered?.revCols||[]); for(const slug of draft.order) draft.types[slug].cols.forEach(c=>s.add(c)); return [...s].sort(); }
  function dupes(){ const seen={}; for(const slug of draft.order){ const t=draft.types[slug]; if(!t.on)continue; for(const c of t.cols)(seen[c]=seen[c]||[]).push(t.name); } return Object.entries(seen).filter(([,ts])=>ts.length>1); }
  function autoMap(){ for(const slug of draft.order){ const t=draft.types[slug]; if(t.cols.length)continue;
    const g=(state.discovered?.revCols||[]).find(c=>c.toLowerCase()===`${t.name} revenue`.toLowerCase()) || (state.discovered?.revCols||[]).find(c=>c.toLowerCase().startsWith(t.name.toLowerCase())&&c.toLowerCase().endsWith("revenue")); if(g)t.cols=[g]; } rerender(); }
  function build(){
    const cols=availableCols(); const dd=dupes();
    const body=h("div",{style:{padding:"24px",fontSize:"13px",lineHeight:"20px"}});
    body.appendChild(Section("How it works", h("div",null,
      Mono("STAGING.HUBSPOT.STG_DEALS")," (New Business + XSell, closed-won) joins ",Mono("KITCHEN.PANTRY.INGR_MONTHLY_REPORT_V2")," on Redo ID (",Mono("TEAM_ID")," = ",Mono("Merchant ID"),"). Expected monthly = deal ARR ÷ 12. Each deal type sums one or more revenue columns below; edit the mapping whenever the report’s columns change, then ",h("strong",{style:{color:T.text}},"Save & refresh"),".")));
    if(dd.length){
      const warn=h("div",{style:{border:`1px solid ${T.orange}`,background:"rgba(255,68,5,0.08)",padding:"10px 14px",marginBottom:"16px",fontSize:"12px",color:"#FFB59B",display:"flex",gap:"8px"}},
        icon(IC.alert,15), h("div",null, "Same revenue column mapped to multiple included types — this double-counts revenue:", dd.map(([c,ts])=>h("div",{style:{marginTop:"4px"}}, Mono(c)," → ",ts.join(", ")))));
      body.appendChild(warn);
    }
    body.appendChild(h("div",{style:{display:"flex",gap:"8px",marginBottom:"16px"}},
      h("button",{style:{display:"inline-flex",alignItems:"center",gap:"6px",padding:"6px 12px",fontSize:"12px",fontWeight:600,cursor:"pointer",border:`1px solid ${T.divider2}`,background:"transparent",color:T.body}, onClick:autoMap}, icon(IC.wand,13),"Auto-map unmapped by name")));
    CLOUDS.forEach(cl=>{
      const slugs=draft.order.filter(s=>(draft.types[s].cloud||"other")===cl.id); if(!slugs.length)return;
      const group=h("div",{style:{marginBottom:"20px"}}, h("div",{style:{fontSize:"10px",fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:T.muted,marginBottom:"8px"}}, cl.label));
      slugs.forEach(slug=>{
        const t=draft.types[slug]; const open=expanded===slug;
        const rowTop=h("div",{style:{display:"flex",alignItems:"center",gap:"10px"}},
          h("label",{style:{cursor:"pointer",display:"inline-flex"}, onClick:()=>{t.on=!t.on;rerender();}}, checkBox(t.on,15)),
          h("div",{style:{minWidth:"150px"}},
            h("div",{style:{fontSize:"13px",color:T.text,fontWeight:600}}, t.name),
            h("div",{style:{fontSize:"10px",color:T.muted}}, `${slug}${t.count!=null?` · ${t.count} deals · ${fmtMoney(t.arr)} ARR`:""}`)),
          h("button",{style:{marginLeft:"auto",textAlign:"right",background:"none",border:`1px solid ${T.divider2}`,color:t.cols.length?T.body:T.orange,cursor:"pointer",fontSize:"11px",padding:"4px 10px",maxWidth:"280px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}, onClick:()=>{expanded=open?null:slug;rerender();}}, t.cols.length?t.cols.join(" + "):"unmapped — click to map"));
        const rowWrap=h("div",{style:{borderBottom:`1px solid ${T.divider}`,padding:"8px 0"}}, rowTop);
        if(open) rowWrap.appendChild(ColumnPicker(cols, t.cols, c=>{ const i=t.cols.indexOf(c); if(i>=0)t.cols.splice(i,1); else t.cols.push(c); rerender(); }));
        group.appendChild(rowWrap);
      });
      body.appendChild(group);
    });
    const footer=h("div",{style:{position:"sticky",bottom:0,background:T.surface,borderTop:`1px solid ${T.divider2}`,padding:"16px",display:"flex",gap:"8px",justifyContent:"flex-end"}},
      h("button",{style:{padding:"10px 18px",fontSize:"12px",fontWeight:600,cursor:"pointer",border:`1px solid ${T.divider2}`,background:"transparent",color:T.body}, onClick:close},"Cancel"),
      h("button",{style:{padding:"10px 18px",fontSize:"12px",fontWeight:600,cursor:"pointer",border:"1px solid #F7F6F4",background:"#F7F6F4",color:T.page}, onClick:()=>saveConfigAndRefresh(draft)},"Save & refresh"));
    return h("aside",{style:{position:"relative",width:"min(680px, 100vw)",background:T.surface,borderLeft:`1px solid ${T.divider2}`,height:"100%",overflowY:"auto",color:T.body}},
      h("div",{style:{padding:"24px",borderBottom:`1px solid ${T.divider}`,display:"flex",alignItems:"flex-start",position:"sticky",top:0,background:T.surface,zIndex:2}},
        h("div",{style:{marginRight:"auto"}},
          h("div",{style:{fontSize:"10px",fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:T.muted}},"Configuration"),
          h("div",{style:{fontFamily:SERIF,fontSize:"28px",lineHeight:"32px",color:T.text,marginTop:"4px"}},"Deal type → revenue column")),
        h("button",{style:{background:"none",border:"none",color:T.muted,cursor:"pointer"}, onClick:close}, icon(IC.x,18))),
      body, footer);
  }
  let panel=build();
  return h("div",{style:{position:"fixed",inset:0,zIndex:50,display:"flex",justifyContent:"flex-end"}},
    h("div",{style:{position:"absolute",inset:0,background:"rgba(13,13,13,0.72)"}, onClick:close}), panel);
}
function Section(label, child){ return h("div",{style:{marginBottom:"24px"}},
  h("div",{style:{fontSize:"10px",fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:T.muted,marginBottom:"8px"}}, label), child); }
function Mono(t){ return h("span",{style:{fontSize:"11px",background:"rgba(255,255,255,0.06)",padding:"1px 5px",color:T.text}}, t); }
function ColumnPicker(cols, selectedCols, onToggle){
  let q="";
  const wrap=h("div",{style:{marginTop:"8px",marginLeft:"25px",border:`1px solid ${T.divider}`,background:T.surfaceAlt,padding:"10px"}});
  const input=h("input",{value:"",placeholder:"Filter revenue columns…",style:{width:"100%",padding:"6px 8px",fontSize:"12px",background:T.page,border:`1px solid ${T.divider2}`,color:T.text,marginBottom:"8px"}});
  const list=h("div",{style:{maxHeight:"200px",overflowY:"auto",display:"grid",gridTemplateColumns:"1fr 1fr",gap:"2px 12px"}});
  function fill(){ list.innerHTML=""; const shown=cols.filter(c=>c.toLowerCase().includes(q.toLowerCase()));
    shown.forEach(c=>{ const on=selectedCols.includes(c);
      list.appendChild(h("label",{style:{display:"flex",alignItems:"center",gap:"6px",padding:"3px 0",cursor:"pointer",fontSize:"11px",color:on?T.text:T.body}, onClick:()=>onToggle(c)}, checkBox(on,13), c)); });
    if(!shown.length) list.appendChild(h("div",{style:{fontSize:"11px",color:T.muted,padding:"4px"}}, `No columns match “${q}”.`));
  }
  input.addEventListener("input",e=>{ q=e.target.value; fill(); });
  fill(); wrap.appendChild(input); wrap.appendChild(list); return wrap;
}
